<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Detalle Proyecto</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded shadow">

    <h1 class="text-3xl font-bold text-blue-800 mb-4">
        {{ proyecto.titulo }}
    </h1>

    <p class="text-gray-500 mb-4">
        Fecha: {{ proyecto.fecha }}
    </p>

    <p class="text-gray-700 mb-6">
        {{ proyecto.descripcion }}
    </p>

    <a href="/aprobados/" class="text-blue-600 hover:underline">
        ← Volver a proyectos
    </a>

</div>

</body>
</html>
