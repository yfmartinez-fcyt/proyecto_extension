{% extends 'base.html' %}
{% load static %}

{% block title %}{{ proyecto.titulo }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/detalle_repositorio.css' %}">
{% endblock %}

{% block content %}
<div class="detalle-page">

    <section class="content-card">

        <h1 class="detalle-title">
            {{ proyecto.titulo }}
        </h1>

        <p class="detalle-date">
            <i class="bi bi-calendar"></i> {{ proyecto.fecha }}
        </p>

        <p class="detalle-description">
            {{ proyecto.descripcion }}
        </p>

        <a href="{% url 'repositorio_proyectos' %}" class="btn btn-outline-primary mt-3">
            ← Volver a proyectos
        </a>

    </section>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/detalle_repositorio.js' %}"></script>
{% endblock %}
