<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarCanvas">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menú principal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body p-0">
        <ul class="nav flex-column p-3 gap-2">

            <li class="nav-item">
                <a class="nav-link sidebar-link" href="{% url 'inicio' %}">
                    <i class="bi bi-house me-2"></i>Inicio
                </a>
            </li>

            {% if user.is_authenticated and user.rol == 'director_extension' %}
            <li class="nav-item">
                <a class="nav-link sidebar-link" href="{% url 'dashboard_director' %}">
                    <i class="bi bi-shield-check me-2"></i>Portal Director
                </a>
            </li>
            {% elif user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link sidebar-link" href="{% url 'nuevo_proyecto' %}">
                    <i class="bi bi-plus-circle me-2"></i>Nuevo Proyecto
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link sidebar-link" href="{% url 'mis_proyectos' %}">
                    <i class="bi bi-folder2-open me-2"></i>Mis Proyectos
                </a>
            </li>
            {% endif %}

            <li class="nav-item">
                <a class="nav-link sidebar-link" href="{% url 'lineas_accion' %}">
                    <i class="bi bi-diagram-3 me-2"></i>Líneas de acción
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link sidebar-link" href="{% url 'repositorio_proyectos' %}">
                    <i class="bi bi-archive me-2"></i>Repositorio de Proyectos
                </a>
            </li>

        </ul>
    </div>
</div>
